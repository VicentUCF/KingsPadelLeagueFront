<app-modal-shell
  [description]="
    mode() === 'create'
      ? 'El nuevo equipo se asociará automáticamente a la season activa.'
      : 'Actualiza la identidad operativa del equipo sin tocar roster, roles ni fixtures.'
  "
  [isOpen]="isOpen()"
  [title]="mode() === 'create' ? 'Crear equipo' : 'Editar equipo'"
  size="wide"
  (closed)="close()"
>
  <div modalBody class="team-form-dialog__body">
    <nav class="team-form-dialog__steps" aria-label="Progreso del formulario">
      <button
        type="button"
        class="team-form-dialog__step"
        [class.team-form-dialog__step--active]="isCurrentStep(0)"
        (click)="currentStep.set(0)"
      >
        <span class="team-form-dialog__step-num">1</span>
        <div>
          <strong>Identidad</strong>
          <small>Nombre y siglas</small>
        </div>
      </button>
      <div class="team-form-dialog__step-divider" aria-hidden="true"></div>
      <button
        type="button"
        class="team-form-dialog__step"
        [class.team-form-dialog__step--active]="isCurrentStep(1)"
        (click)="nextStep()"
      >
        <span class="team-form-dialog__step-num">2</span>
        <div>
          <strong>Operación</strong>
          <small>Presidente y colores</small>
        </div>
      </button>
    </nav>

    @if (submissionError()) {
      <p class="team-form-dialog__error" role="alert">{{ submissionError() }}</p>
    }

    <form [formGroup]="form" class="team-form-dialog__form" id="team-form" (ngSubmit)="submit()">
      @switch (currentStep()) {
        @case (0) {
          <div class="team-form-dialog__grid">
            <label class="c-field">
              <span class="c-field__label">Nombre <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('name')"
                formControlName="name"
                type="text"
                autocomplete="off"
              />
              @if (hasControlError('name')) {
                <p class="c-field__error" role="alert">El nombre del equipo es obligatorio.</p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Siglas <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('shortName')"
                formControlName="shortName"
                type="text"
                maxlength="5"
                autocomplete="off"
                placeholder="KOF"
              />
              @if (hasControlError('shortName')) {
                <p class="c-field__error" role="alert">Usa entre 2 y 5 letras en mayúsculas.</p>
              } @else {
                <p class="c-field__helper">2-5 letras en mayúsculas (ej. KOF, MJR)</p>
              }
            </label>
          </div>
        }
        @case (1) {
          <div class="team-form-dialog__grid">
            <label class="c-field c-field--full">
              <span class="c-field__label">Presidente <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('presidentName')"
                formControlName="presidentName"
                type="text"
                autocomplete="off"
              />
              @if (hasControlError('presidentName')) {
                <p class="c-field__error" role="alert">La presidencia actual es obligatoria.</p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Color principal <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('primaryColor')"
                formControlName="primaryColor"
                type="text"
                placeholder="#1B1F3B"
              />
              @if (hasControlError('primaryColor')) {
                <p class="c-field__error" role="alert">Introduce un color hexadecimal válido.</p>
              } @else {
                <p class="c-field__helper">Formato hexadecimal, p.ej. #1B1F3B</p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Color secundario <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('secondaryColor')"
                formControlName="secondaryColor"
                type="text"
                placeholder="#D4AF37"
              />
              @if (hasControlError('secondaryColor')) {
                <p class="c-field__error" role="alert">Introduce un color hexadecimal válido.</p>
              } @else {
                <p class="c-field__helper">Formato hexadecimal, p.ej. #D4AF37</p>
              }
            </label>
          </div>
        }
      }
    </form>
  </div>

  <div class="team-form-dialog__actions" modalFooter>
    <button
      class="c-button c-button--pill c-button--ghost c-button--md"
      type="button"
      (click)="close()"
    >
      Cancelar
    </button>

    @if (!isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--ghost c-button--md"
        type="button"
        (click)="previousStep()"
      >
        ← Anterior
      </button>
    }

    @if (isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        type="button"
        (click)="nextStep()"
      >
        Siguiente →
      </button>
    } @else {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        form="team-form"
        [disabled]="isSubmitting()"
        type="submit"
      >
        {{
          isSubmitting() ? 'Guardando…' : mode() === 'create' ? 'Crear equipo' : 'Guardar cambios'
        }}
      </button>
    }
  </div>
</app-modal-shell>
