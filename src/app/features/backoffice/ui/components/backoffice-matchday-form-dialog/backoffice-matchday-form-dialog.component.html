<app-modal-shell
  [isOpen]="isOpen()"
  [title]="'Nueva jornada'"
  description="Define la jornada y déjala lista para la operativa del backoffice."
  size="default"
  (closed)="close()"
>
  <div modalBody>
    @if (submissionError()) {
      <p class="backoffice-matchday-form-dialog__error" role="alert">{{ submissionError() }}</p>
    }

    <form
      [formGroup]="form"
      class="backoffice-matchday-form-dialog__form"
      id="backoffice-matchday-form"
      (ngSubmit)="submit()"
    >
      <label class="c-field">
        <span class="c-field__label">Nombre <span aria-hidden="true">*</span></span>
        <input
          class="c-input c-input--md"
          [class.c-input--invalid]="hasControlError('name')"
          formControlName="name"
          type="text"
          autocomplete="off"
          placeholder="Jornada 9"
        />
        @if (hasControlError('name')) {
          <p class="c-field__error" role="alert">El nombre es obligatorio.</p>
        }
      </label>

      <label class="c-field">
        <span class="c-field__label">Fecha y hora <span aria-hidden="true">*</span></span>
        <input
          class="c-input c-input--md"
          [class.c-input--invalid]="hasControlError('scheduledAt')"
          formControlName="scheduledAt"
          type="datetime-local"
        />
        @if (hasControlError('scheduledAt')) {
          <p class="c-field__error" role="alert">La fecha es obligatoria.</p>
        }
      </label>

      <label class="c-field">
        <span class="c-field__label">Temporada <span aria-hidden="true">*</span></span>
        <input
          class="c-input c-input--md"
          [class.c-input--invalid]="hasControlError('seasonId')"
          formControlName="seasonId"
          type="text"
          autocomplete="off"
          placeholder="season-2026"
        />
        @if (hasControlError('seasonId')) {
          <p class="c-field__error" role="alert">La temporada es obligatoria.</p>
        }
      </label>
    </form>
  </div>

  <div modalFooter class="backoffice-matchday-form-dialog__actions">
    <button
      class="c-button c-button--pill c-button--ghost c-button--md"
      type="button"
      (click)="close()"
    >
      Cancelar
    </button>
    <button
      class="c-button c-button--pill c-button--primary c-button--md"
      form="backoffice-matchday-form"
      [disabled]="isSubmitting()"
      type="submit"
    >
      {{ isSubmitting() ? 'Creando…' : 'Crear jornada' }}
    </button>
  </div>
</app-modal-shell>
