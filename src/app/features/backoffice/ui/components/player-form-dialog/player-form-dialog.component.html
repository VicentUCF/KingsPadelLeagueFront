<app-modal-shell
  [description]="
    mode() === 'create'
      ? 'La ficha define el perfil base del jugador y su equipo actual derivado.'
      : 'Actualiza la ficha del jugador sin tocar participaciones ni nominaciones históricas.'
  "
  [isOpen]="isOpen()"
  [title]="mode() === 'create' ? 'Crear ficha' : 'Editar ficha'"
  size="wide"
  (closed)="close()"
>
  <div modalBody class="player-form-dialog__body">
    <nav class="player-form-dialog__steps" aria-label="Progreso del formulario">
      <button
        type="button"
        class="player-form-dialog__step"
        [class.player-form-dialog__step--active]="isCurrentStep(0)"
        (click)="currentStep.set(0)"
      >
        <span class="player-form-dialog__step-num">1</span>
        <div class="player-form-dialog__step-info">
          <strong>Identidad</strong>
          <small>Nombre y avatar</small>
        </div>
      </button>
      <div class="player-form-dialog__step-divider" aria-hidden="true"></div>
      <button
        type="button"
        class="player-form-dialog__step"
        [class.player-form-dialog__step--active]="isCurrentStep(1)"
        (click)="nextStep()"
      >
        <span class="player-form-dialog__step-num">2</span>
        <div class="player-form-dialog__step-info">
          <strong>Perfil</strong>
          <small>Posición y equipo</small>
        </div>
      </button>
    </nav>

    @if (submissionError()) {
      <p class="player-form-dialog__error" role="alert">{{ submissionError() }}</p>
    }

    <form
      [formGroup]="form"
      class="player-form-dialog__form"
      id="player-form"
      (ngSubmit)="submit()"
    >
      @switch (currentStep()) {
        @case (0) {
          <div class="player-form-dialog__grid">
            <label class="c-field">
              <span class="c-field__label">Nombre completo <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('fullName')"
                formControlName="fullName"
                type="text"
                autocomplete="off"
              />
              @if (hasControlError('fullName')) {
                <p class="c-field__error" role="alert">El nombre completo es obligatorio.</p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Nick <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('nickName')"
                formControlName="nickName"
                type="text"
                autocomplete="off"
              />
              @if (hasControlError('nickName')) {
                <p class="c-field__error" role="alert">El nick es obligatorio.</p>
              }
            </label>

            <label class="c-field c-field--full">
              <span class="c-field__label">Avatar</span>
              <input
                class="c-input c-input--md"
                formControlName="avatarPath"
                type="text"
                placeholder="Ruta o URL de imagen (opcional)"
              />
              <p class="c-field__helper">Si se deja vacío se mostrará un fallback textual.</p>
            </label>
          </div>
        }
        @case (1) {
          <div class="player-form-dialog__grid">
            <label class="c-field">
              <span class="c-field__label">Perfil de pista</span>
              <select class="c-select c-input--md" formControlName="preferredSideLabel">
                <option value="Revés">Revés</option>
                <option value="Derecha">Derecha</option>
                <option value="Ambas">Ambas</option>
              </select>
            </label>

            <label class="c-field">
              <span class="c-field__label">Equipo actual</span>
              <select class="c-select c-input--md" formControlName="currentTeamId">
                <option value="">Sin equipo activo</option>
                @for (team of teamOptions(); track team.id) {
                  <option [value]="team.id">{{ team.label }}</option>
                }
              </select>
            </label>

            <label class="c-field">
              <span class="c-field__label">Email vinculado</span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('linkedUserEmail')"
                formControlName="linkedUserEmail"
                type="email"
                placeholder="usuario@ejemplo.com"
              />
              @if (hasControlError('linkedUserEmail')) {
                <p class="c-field__error" role="alert">
                  Introduce un email válido o deja el campo vacío.
                </p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Estado</span>
              <select class="c-select c-input--md" formControlName="status">
                <option value="ACTIVE">Activo</option>
                <option value="INACTIVE">Inactivo</option>
              </select>
            </label>
          </div>
        }
      }
    </form>
  </div>

  <div class="player-form-dialog__actions" modalFooter>
    <button
      class="c-button c-button--pill c-button--ghost c-button--md"
      type="button"
      (click)="close()"
    >
      Cancelar
    </button>

    @if (!isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--ghost c-button--md"
        type="button"
        (click)="previousStep()"
      >
        ← Anterior
      </button>
    }

    @if (isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        type="button"
        (click)="nextStep()"
      >
        Siguiente →
      </button>
    } @else {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        form="player-form"
        [disabled]="isSubmitting()"
        type="submit"
      >
        {{
          isSubmitting() ? 'Guardando…' : mode() === 'create' ? 'Crear ficha' : 'Guardar cambios'
        }}
      </button>
    }
  </div>
</app-modal-shell>
