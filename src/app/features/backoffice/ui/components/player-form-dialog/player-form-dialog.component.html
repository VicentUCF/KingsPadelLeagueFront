<app-modal-shell
  [description]="
    mode() === 'create'
      ? 'La ficha define el perfil base del jugador.'
      : 'Actualiza solo los campos que el backend permite persistir hoy.'
  "
  [isOpen]="isOpen()"
  [title]="mode() === 'create' ? 'Crear ficha' : 'Editar jugador'"
  size="wide"
  (closed)="close()"
>
  <div modalBody class="player-form-dialog__body">
    <nav class="player-form-dialog__steps" aria-label="Progreso del formulario">
      <button
        type="button"
        class="player-form-dialog__step"
        [class.player-form-dialog__step--active]="isCurrentStep(0)"
        (click)="currentStep.set(0)"
      >
        <span class="player-form-dialog__step-num">1</span>
        <div class="player-form-dialog__step-info">
          <strong>Identidad</strong>
          <small>Nombre, alias y avatar</small>
        </div>
      </button>
      <div class="player-form-dialog__step-divider" aria-hidden="true"></div>
      <button
        type="button"
        class="player-form-dialog__step"
        [class.player-form-dialog__step--active]="isCurrentStep(1)"
        (click)="nextStep()"
      >
        <span class="player-form-dialog__step-num">2</span>
        <div class="player-form-dialog__step-info">
          <strong>Perfil</strong>
          <small>Posición y redes</small>
        </div>
      </button>
    </nav>

    @if (submissionError()) {
      <p class="player-form-dialog__error" role="alert">{{ submissionError() }}</p>
    }

    @if (mode() === 'edit') {
      <p class="player-form-dialog__hint">
        Solo se guardan alias, nombre, apellidos, posicion preferida, Instagram e imagen.
      </p>
    }

    <form
      [formGroup]="form"
      class="player-form-dialog__form"
      id="player-form"
      (ngSubmit)="submit()"
    >
      @switch (currentStep()) {
        @case (0) {
          <div class="player-form-dialog__grid">
            <label class="c-field">
              <span class="c-field__label">Nombre <span aria-hidden="true">*</span></span>
              <input
                class="c-input c-input--md"
                [class.c-input--invalid]="hasControlError('firstName')"
                formControlName="firstName"
                type="text"
                autocomplete="off"
              />
              @if (hasControlError('firstName')) {
                <p class="c-field__error" role="alert">El nombre es obligatorio.</p>
              }
            </label>

            <label class="c-field">
              <span class="c-field__label">Apellidos</span>
              <input
                class="c-input c-input--md"
                formControlName="lastName"
                type="text"
                autocomplete="off"
              />
            </label>

            <label class="c-field">
              <span class="c-field__label">Alias</span>
              <input
                class="c-input c-input--md"
                formControlName="alias"
                type="text"
                autocomplete="off"
              />
              <p class="c-field__helper">
                Si se deja vacío, el directorio mostrará la posición preferida.
              </p>
            </label>

            <label class="c-field c-field--full">
              <span class="c-field__label">Imagen de perfil</span>
              <input
                class="c-input c-input--md"
                formControlName="profileImage"
                type="text"
                placeholder="Ruta o URL de imagen (opcional)"
              />
              <p class="c-field__helper">Si se deja vacío se mostrará un fallback textual.</p>
            </label>
          </div>
        }
        @case (1) {
          <div class="player-form-dialog__grid">
            <label class="c-field">
              <span class="c-field__label">Perfil de pista</span>
              <div class="c-select-wrap">
                <select class="c-select c-input--md" formControlName="preferredPosition">
                  <option value="left">Revés</option>
                  <option value="right">Derecha</option>
                  <option value="both">Ambas</option>
                </select>
                <span class="c-select-wrap__icon">
                  <lucide-angular [img]="chevronDownIcon" [size]="16" aria-hidden="true" />
                </span>
              </div>
            </label>

            <label class="c-field">
              <span class="c-field__label">Instagram</span>
              <input
                class="c-input c-input--md"
                formControlName="instagramUrl"
                type="text"
                placeholder="https://instagram.com/usuario"
              />
            </label>

            <label class="c-field">
              <span class="c-field__label">Email</span>
              <input
                class="c-input c-input--md"
                [value]="initialValue().email"
                type="text"
                readonly
              />
              <p class="c-field__helper">Campo informativo. No editable con el contrato actual.</p>
            </label>

            <label class="c-field">
              <span class="c-field__label">Equipo actual</span>
              <input
                class="c-input c-input--md"
                [value]="initialValue().teamLabel"
                type="text"
                readonly
              />
              <p class="c-field__helper">
                Campo informativo. La reasignación de equipo no está disponible aún.
              </p>
            </label>
          </div>
        }
      }
    </form>
  </div>

  <div class="player-form-dialog__actions" modalFooter>
    <button
      class="c-button c-button--pill c-button--ghost c-button--md"
      type="button"
      (click)="close()"
    >
      Cancelar
    </button>

    @if (!isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--ghost c-button--md"
        type="button"
        (click)="previousStep()"
      >
        ← Anterior
      </button>
    }

    @if (isFirstStep()) {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        type="button"
        (click)="nextStep()"
      >
        Siguiente →
      </button>
    } @else {
      <button
        class="c-button c-button--pill c-button--primary c-button--md"
        form="player-form"
        [disabled]="isSubmitting()"
        type="submit"
      >
        {{
          isSubmitting() ? 'Guardando…' : mode() === 'create' ? 'Crear ficha' : 'Guardar cambios'
        }}
      </button>
    }
  </div>
</app-modal-shell>
