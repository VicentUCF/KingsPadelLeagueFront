<div class="auth-shell">
  <div class="auth-shell__brand">
    <img
      alt="KingsPadelLeague"
      class="auth-shell__brand-image"
      decoding="async"
      height="72"
      loading="eager"
      [src]="applicationMetadata.logoPath"
      width="170"
    />
  </div>

  <main class="auth-shell__content">
    <router-outlet />
  </main>

  <footer class="auth-shell__footer">
    <p>© {{ year }} Kings of Favar Fantasy</p>
  </footer>
</div>
