<div class="auth-card">
  <header class="auth-card__header">
    <h1 class="auth-card__title">Bienvenido de nuevo</h1>
    <p class="auth-card__subtitle">Accede a tu panel de gestión</p>
  </header>

  @if (error()) {
    <div class="auth-card__alert" role="alert">
      <span>{{ error() }}</span>
    </div>
  }

  <form class="auth-card__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="c-field">
      <label class="c-field__label" for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        class="c-input c-input--lg"
        [class.c-input--invalid]="emailError"
        formControlName="email"
        placeholder="tu@email.com"
        autocomplete="email"
        [attr.aria-describedby]="emailError ? 'email-error' : null"
      />
      @if (emailError) {
        <p id="email-error" class="c-field__error">{{ emailError }}</p>
      }
    </div>

    <div class="c-field">
      <div class="auth-card__label-row">
        <label class="c-field__label" for="password">Contraseña</label>
        <a class="auth-card__forgot" routerLink="/auth/forgot-password"
          >¿Olvidaste tu contraseña?</a
        >
      </div>
      <div class="auth-card__input-wrap">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="c-input c-input--lg"
          [class.c-input--invalid]="passwordError"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.aria-describedby]="passwordError ? 'password-error' : null"
        />
        <button
          type="button"
          class="auth-card__eye-btn"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <lucide-icon [img]="EyeOffIcon" size="18" />
          } @else {
            <lucide-icon [img]="EyeIcon" size="18" />
          }
        </button>
      </div>
      @if (passwordError) {
        <p id="password-error" class="c-field__error">{{ passwordError }}</p>
      }
    </div>

    <button
      type="submit"
      class="c-button c-button--primary c-button--lg auth-card__submit"
      [disabled]="isLoading()"
    >
      @if (isLoading()) {
        <span class="auth-card__spinner" aria-hidden="true"></span>
        Entrando...
      } @else {
        <lucide-icon [img]="LogInIcon" size="16" />
        Iniciar sesión
      }
    </button>
  </form>

  <footer class="auth-card__footer">
    <p>¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a></p>
  </footer>
</div>
