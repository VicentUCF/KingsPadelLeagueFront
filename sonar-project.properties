# SonarQube / SonarCloud analysis configuration.
#
# sonar.projectKey and sonar.organization are intentionally NOT set here —
# nobody has created a SonarCloud/SonarQube project for this repo yet. Fill
# them in (or pass as -Dsonar.projectKey=... -Dsonar.organization=... in CI)
# once one exists. See docs/quality.md for the full list of values CI must
# provide (SONAR_TOKEN, SONAR_HOST_URL, project key, organization).
#
# sonar.projectKey=
# sonar.organization=

sonar.sources=src
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,coverage/**,playwright-report/**,test-results/**,public/admin/**,design/**,.astro/**
sonar.test.inclusions=tests/**/*.test.ts,tests/e2e/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
